name: python

# pyyaml-zig's wheels (python/): the extension built on each platform's own
# runner against that runner's Python (its headers, and on Windows its
# python3.lib), to CPython's stable ABI, so each wheel serves 3.9 and later;
# packed by tools/python_wheel.py, installed by pip into a fresh venv, and
# python/tests run against what pip installed, from outside the checkout.
# ci.yml calls this on every change, so a tag never finds a platform that
# does not build; release.yml calls it on the tagged commit and publishes
# what it builds.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  wheel:
    name: wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-linux, arch: x64, tag: "manylinux_2_17_x86_64.manylinux2014_x86_64.musllinux_1_1_x86_64" }
          - { os: ubuntu-24.04-arm, target: aarch64-linux, arch: arm64, tag: "manylinux_2_17_aarch64.manylinux2014_aarch64.musllinux_1_1_aarch64" }
          - { os: macos-latest, target: aarch64-macos.13.0, arch: arm64, tag: macosx_13_0_arm64 }
          # Built on the same arm64 runner, and tested on an x86_64 Python
          # under Rosetta.
          - { os: macos-latest, target: x86_64-macos.13.0, arch: x64, tag: macosx_13_0_x86_64 }
          - { os: windows-latest, target: x86_64-windows, arch: x64, tag: win_amd64 }
          - { os: windows-11-arm, target: aarch64-windows, arch: arm64, tag: win_arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
      - name: build the extension
        env:
          TARGET: ${{ matrix.target }}
        run: |
          include=$(python -c "import sysconfig; print(sysconfig.get_paths()['include'])")
          args=(python -Doptimize=ReleaseFast "-Dtarget=$TARGET" "-Dpython-include=$include")
          if [ "$RUNNER_OS" = Windows ]; then
            args+=("-Dpython-lib=$(python -c "import os, sys; print(os.path.join(sys.base_prefix, 'libs'))")")
          fi
          zig build "${args[@]}"
      # The Linux wheel is tagged for glibc and musl both, which holds only
      # while the library needs neither.
      - name: on Linux, the extension needs no libc
        if: runner.os == 'Linux'
        run: |
          so=zig-out/python/pyyaml_zig/_yaml.abi3.so
          readelf -d "$so"
          if readelf -d "$so" | grep -q NEEDED; then
            echo "the extension needs a library, so its wheel cannot be tagged manylinux and musllinux both" >&2
            exit 1
          fi
      - name: pack the wheel
        env:
          TAG: ${{ matrix.tag }}
        run: python -I tools/python_wheel.py "$TAG"
      - name: pip installs it, and the tests pass against it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python"
          "$py" -m pip install --no-index --find-links zig-out/wheels pyyaml-zig
          # PyYAML, for the tests that hold results to it; they are skipped
          # where it does not install.
          "$py" -m pip install pyyaml || echo "no PyYAML here: its comparisons are skipped"
          tests="$PWD/python/tests"
          cd "$RUNNER_TEMP"
          "$py" -c "import pyyaml_zig; print(pyyaml_zig.__version__, pyyaml_zig.__file__)"
          "$py" -m unittest discover -s "$tests" -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: zig-out/wheels/*.whl
          retention-days: 7
          if-no-files-found: error

  # The stable ABI's promise, checked: the wheel built against 3.13's
  # headers, on the oldest Python it claims.
  oldest-python:
    name: the Linux wheel on Python 3.9
    needs: wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-x86_64-linux
          path: wheels
      - name: pip installs it, and the tests pass against it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" -m pip install --no-index --find-links wheels pyyaml-zig
          "$py" -m pip install pyyaml
          tests="$PWD/python/tests"
          cd "$RUNNER_TEMP"
          "$py" -m unittest discover -s "$tests" -v
