# zigvet and gnarl on the PATH, for `zig build test`, which runs both
# (build.zig's lint and complexity steps), on every runner the tests run
# on.
#
# gnarl is the release complexity.zon's `.gnarl` names, so its version
# lives in one place; zigvet's is pinned below. Each binary is checked
# against a digest written here rather than one fetched beside it, so a
# release asset replaced later cannot change what CI runs. To move to a
# new release: change the version (for gnarl, `.gnarl` in complexity.zon,
# and run `gnarl --update-baseline .` with it), and add its digests below
# from that release's SHA256SUMS, one for each runner ci.yml uses. A
# version or a runner with no digest here fails the job, naming what is
# missing.
name: Install zigvet and gnarl
description: Put the pinned zigvet and gnarl releases on the PATH, each checked against its digest
runs:
  using: composite
  steps:
    - name: Install zigvet and gnarl
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) platform=linux-amd64 ;;
          macOS-ARM64) platform=darwin-arm64 ;;
          *) echo "::error::no zigvet or gnarl digest for $RUNNER_OS $RUNNER_ARCH in .github/actions/vet-tools/action.yml"; exit 1 ;;
        esac
        if command -v sha256sum > /dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
        dir="$RUNNER_TEMP/vet-tools"
        mkdir -p "$dir"

        zigvet_version=v0.26.1
        gnarl_version="v$(sed -n 's/.*\.gnarl = "\([^"]*\)".*/\1/p' complexity.zon)"
        if [ "$gnarl_version" = v ]; then
          echo "::error::complexity.zon names no .gnarl release"
          exit 1
        fi

        # The tool, its release, and the digest of its binary for this runner.
        install() {
          local name=$1 version=$2 want=
          case "$name-$version-$platform" in
            zigvet-v0.26.1-linux-amd64) want=41d0923b1895e9cd8646ad0bb7687d73c8b7c41aaf1597d04996de9ded502a3c ;;
            zigvet-v0.26.1-darwin-arm64) want=35879b09ae17e87939da4521f4e261e4f17fdd65686f437882ecb51719b2de15 ;;
            gnarl-v0.7.0-linux-amd64) want=3b98843a610e74862a2e62edf3dbb2d35be3e74485718e703429c84f2b8e57f3 ;;
            gnarl-v0.7.0-darwin-arm64) want=82ccdb87a5ef91ea2eff5b1e9cdc58f26e6a9563622bbadf457fb37f6f3311e8 ;;
          esac
          if [ -z "$want" ]; then
            echo "::error::no digest pinned for $name $version $platform in .github/actions/vet-tools/action.yml; add it from that release's SHA256SUMS"
            exit 1
          fi
          curl -fsSLo "$dir/$name" "https://github.com/kmoneil/$name/releases/download/$version/$name-$platform"
          local got
          got=$($sum < "$dir/$name" | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "::error::$name $version for $platform has digest $got, not the $want pinned here"
            exit 1
          fi
          chmod +x "$dir/$name"
          "$dir/$name" --version
        }
        install zigvet "$zigvet_version"
        install gnarl "$gnarl_version"

        echo "$dir" >> "$GITHUB_PATH"
