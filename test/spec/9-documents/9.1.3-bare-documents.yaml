---
- name: Bare documents, and a '%' first in a literal scalar (Example 9.3)
  spec:
    productions: [207]
    quotes:
    - "9.1.3: A bare document does not begin with any directives or marker lines."
    - "[207] l-bare-document ::= s-l+block-node(-1,BLOCK-IN) /* Excluding c-forbidden content */"
  yaml: |
    Bare
    document
    ...
    # No document
    ...
    |
    %!PS-Adobe-2.0 # Not the first line
  tree: |
    +STR
     +DOC
      =VAL :Bare document
     -DOC ...
     +DOC
      =VAL |%!PS-Adobe-2.0 # Not the first line\n
     -DOC
    -STR

- name: A bare document's first line is no directive
  spec:
    productions: [207]
    quotes:
    - "9.1.3: In this case, the first non-comment line may not start with a “%” first character."
    - "[207] l-bare-document"
  note: libfyaml reads an empty stream.
  fail: true
  yaml: |
    # c
    %a: b

- name: A bare document's node indented, its parent at -1
  spec:
    productions: [207]
    quotes:
    - "9.1.3: Since a node must be more indented than its parent node, this allows the document's node to be indented at zero or more spaces."
    - "[207] l-bare-document ::= s-l+block-node(-1,BLOCK-IN)"
  yaml: |
    ␣␣a: 1
    ␣␣b: 2
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :a
       =VAL :1
       =VAL :b
       =VAL :2
      -MAP
     -DOC
    -STR
