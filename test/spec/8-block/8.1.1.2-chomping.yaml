---
- name: A tab-led comment after a block scalar, where the document ends, is the stream's
  spec:
    productions: [169, 78]
    quotes:
    - "[169] l-trail-comments(n) ::= s-indent-less-than(n) c-nb-comment-text b-comment l-comment*"
    - "[78] l-comment ::= s-separate-in-line c-nb-comment-text? b-comment"
  note: >-
    s-indent-less-than takes spaces alone, so the tab's line is none of
    the scalar's trailing comments, and the scalar ends before it. The
    yaml-test-suite's Y79Y/000 is an error only because an entry follows
    the line (karte t68).
  yaml: |
    foo: |
      x
    —»# c∎
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :foo
       =VAL |x\n
      -MAP
     -DOC
    -STR

- name: A clipped block scalar with no text line has no line break to keep
  spec:
    productions: [173, 166, 167]
    quotes:
    - "[173] l-literal-content(n,t) ::= ( l-nb-literal-text(n) b-nb-literal-next(n)* b-chomped-last(t) )? l-chomped-empty(n,t)"
    - "[166] l-chomped-empty(n,CLIP) ::= l-strip-empty(n)"
    - "8.1.1.2: However, any trailing empty lines are excluded from the scalar's content."
    - "[167] l-strip-empty"
  note: >-
    The yaml-test-suite's K858 has `clip: >` and an empty line read as "".
    With the last line a space and no line break, the YAML reference
    parser reads "\n" (karte t82).
  yaml: |
    k: |

    ␣∎
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :k
       =VAL |
      -MAP
     -DOC
    -STR

- name: A kept block scalar keeps the empty line after a text line of a space
  spec:
    productions: [173, 171, 168, 70]
    quotes:
    - "[171] l-nb-literal-text(n) ::= l-empty(n,BLOCK-IN)* s-indent(n) nb-char+"
    - "[168] l-keep-empty(n) ::= l-empty(n,BLOCK-IN)* l-trail-comments(n)?"
    - "8.1.1.2: In this case, the final line break and any trailing empty lines are considered to be part of the scalar's content."
    - "[173] l-literal-content"
    - "[70] l-empty"
  note: >-
    At the top level n is -1, so `|2+` puts the content at column 1, and
    the line of two spaces is text, a space. The YAML reference parser
    reads " \n", dropping the empty line; with `x` for that space it
    reads " x\n\n", as here (karte t82).
  yaml: |
    |2+
    ␣␣
    ↵
  tree: |
    +STR
     +DOC
      =VAL | \n\n
     -DOC
    -STR

- name: Chomping the final line break (Example 8.4)
  spec:
    productions: [164, 165]
    quotes:
    - "8.1.1.2: Stripping is specified by the “-” chomping indicator. In this case, the final line break and any trailing empty lines are excluded from the scalar’s content."
    - "8.1.1.2: Clipping is the default behavior used if no explicit chomping indicator is specified. In this case, the final line break character is preserved in the scalar’s content."
    - "[164] c-chomping-indicator"
    - "[165] b-chomped-last"
  yaml: |
    strip: |-
      text
    clip: |
      text
    keep: |+
      text
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :strip
       =VAL |text
       =VAL :clip
       =VAL |text\n
       =VAL :keep
       =VAL |text\n
      -MAP
     -DOC
    -STR

- name: Chomping trailing lines, and the comments after them (Example 8.5)
  spec:
    productions: [166, 167, 168, 169]
    quotes:
    - "8.1.1.2: To prevent ambiguity, the first such comment line must be less indented than the block scalar content. Additional comment lines, if any, are not so restricted."
    - "[169] l-trail-comments(n) ::= s-indent-less-than(n) c-nb-comment-text b-comment l-comment*"
    - "[166] l-chomped-empty"
    - "[167] l-strip-empty"
    - "[168] l-keep-empty"
  yaml: |
    ␣# Strip
      # Comments:
    strip: |-
      # text
    ␣␣
    ␣# Clip
      # comments:
    ↵
    clip: |
      # text
    ␣
    ␣# Keep
      # comments:
    ↵
    keep: |+
      # text
    ↵
    ␣# Trail
      # comments.
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :strip
       =VAL |# text
       =VAL :clip
       =VAL |# text\n
       =VAL :keep
       =VAL |# text\n\n
      -MAP
     -DOC
    -STR

- name: A scalar of empty lines alone, chomped (Example 8.6)
  spec:
    productions: [166, 167, 168]
    quotes:
    - "8.1.1.2: If a block scalar consists only of empty lines, then these lines are considered as trailing lines and hence are affected by chomping."
    - "[166] l-chomped-empty"
    - "[167] l-strip-empty"
    - "[168] l-keep-empty"
  yaml: |
    strip: >-
    ↵
    clip: >
    ↵
    keep: |+
    ↵
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :strip
       =VAL >
       =VAL :clip
       =VAL >
       =VAL :keep
       =VAL |\n
      -MAP
     -DOC
    -STR

- name: A comment line at the content's indentation is content
  spec:
    productions: [169, 171]
    quotes:
    - "8.1.1.2: To prevent ambiguity, the first such comment line must be less indented than the block scalar content."
    - "[169] l-trail-comments"
    - "[171] l-nb-literal-text"
  yaml: |
    a: |
      x
      # c
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :a
       =VAL |x\n# c\n
      -MAP
     -DOC
    -STR

- name: A stripped scalar ending the input with no line break
  spec:
    productions: [165]
    quotes:
    - "[165] b-chomped-last(STRIP) ::= b-non-content | <end-of-input>"
  yaml: |
    a: |-
      x∎
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :a
       =VAL |x
      -MAP
     -DOC
    -STR

- name: A clipped scalar ending the input with no line break keeps one
  spec:
    productions: [165]
    quotes:
    - "[165] b-chomped-last(CLIP) ::= b-as-line-feed | <end-of-input>"
    - "8.1.1.2: In this case, the final line break character is preserved in the scalar’s content."
  note: >-
    The spec conflicts with itself here. [165] lets the scalar end at
    <end-of-input> in place of b-as-line-feed, so by the productions there
    is no final line break, and the content is "x"; 8.1.1.2 says clipping
    preserves "the final line break character" in the content, and says
    nothing of a scalar with none. yaml.zig follows the yaml-test-suite,
    which reads a line feed there (L24T/01: `foo: |`, `  x`, then three
    spaces and no line break, is "x\n \n"), as the YAML reference parser
    and libfyaml do too: one reading across the readers outweighs the
    gap in the text. Kevin's call, 2026-11-16 (karte t90).
  yaml: |
    a: |
      x∎
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :a
       =VAL |x\n
      -MAP
     -DOC
    -STR

- name: A kept scalar ending the input with no line break keeps one
  spec:
    productions: [165]
    quotes:
    - "[165] b-chomped-last(KEEP) ::= b-as-line-feed | <end-of-input>"
    - "8.1.1.2: In this case, the final line break and any trailing empty lines are considered to be part of the scalar’s content."
  note: >-
    The same conflict as clipping's. [165] lets the scalar end at
    <end-of-input> with no final line break, giving "x"; 8.1.1.2 says
    keeping makes "the final line break" part of the content. yaml.zig
    follows the yaml-test-suite, which reads a line feed at the end of the
    input (JEF9/02: `- |+`, then three spaces and no line break, is "\n"),
    as the YAML reference parser and libfyaml do too. Kevin's call,
    2026-11-16 (karte t90).
  yaml: |
    a: |+
      x∎
  tree: |
    +STR
     +DOC
      +MAP
       =VAL :a
       =VAL |x\n
      -MAP
     -DOC
    -STR
