---
- name: A YAML directive's version is of decimal digits
  spec:
    productions: [35, 87]
    quotes:
    - "[35] ns-dec-digit ::= [x30-x39] # 0-9"
    - "[87] ns-yaml-version ::= ns-dec-digit+ '.' ns-dec-digit+"
  note: The YAML reference parser reads it.
  fail: true
  yaml: |
    %YAML 1.x
    --- a

- name: A named tag handle of word characters, digits and '-' among them
  spec:
    productions: [38, 37, 35, 92]
    quotes:
    - "[38] ns-word-char ::= ns-dec-digit # 0-9 | ns-ascii-letter # A-Z a-z | '-' # '-'"
    - "[37] ns-ascii-letter ::= [x41-x5A] # A-Z | [x61-x7A] # a-z"
    - "[35] ns-dec-digit"
    - "[92] c-named-tag-handle ::= c-tag # '!' ns-word-char+ c-tag # '!'"
  note: libfyaml refuses the directive.
  yaml: |
    %TAG !my-Tag1! tag:z,
    --- !my-Tag1!x y
  tree: |
    +STR
     +DOC ---
      =VAL <tag:z,x> :y
     -DOC
    -STR

- name: A named tag handle with an '_', no word character
  spec:
    productions: [38, 92]
    quotes:
    - "[38] ns-word-char ::= ns-dec-digit # 0-9 | ns-ascii-letter # A-Z a-z | '-' # '-'"
    - "[92] c-named-tag-handle"
  fail: true
  yaml: |
    %TAG !my_tag! tag:z,
    --- !my_tag!x y

- name: A named tag handle with a letter not ASCII
  spec:
    productions: [37, 92]
    quotes:
    - "[37] ns-ascii-letter ::= [x41-x5A] # A-Z | [x61-x7A] # a-z"
    - "[92] c-named-tag-handle"
  fail: true
  yaml: |
    %TAG !é! tag:z,
    --- !é!x y

- name: A verbatim tag of every URI character
  spec:
    productions: [39, 98]
    quotes:
    - "5.6: URI characters for tags, as defined in the URI specification"
    - "[39] ns-uri-char ::= ( '%' ns-hex-digit{2} ) | ns-word-char | '#' | ';' | '/' | '?' | ':' | '@' | '&' | '=' | '+' | '$' | ',' | '_' | '.' | '!' | '~' | '*' | \"'\" | '(' | ')' | '[' | ']'"
    - "[98] c-verbatim-tag"
  note: libfyaml refuses it.
  yaml: |
    !<tag:a#b;c/d?e:f@g&h=i+j$k,l_m.n!o~p*q'r(s)t[u]v-w> x
  tree: |
    +STR
     +DOC
      =VAL <tag:a#b;c/d?e:f@g&h=i+j$k,l_m.n!o~p*q'r(s)t[u]v-w> :x
     -DOC
    -STR

- name: A verbatim tag with a '{', no URI character
  spec:
    productions: [39, 98]
    quotes:
    - "[39] ns-uri-char"
    - "[98] c-verbatim-tag ::= \"!<\" ns-uri-char+ '>'"
  fail: true
  yaml: |
    !<tag:a{b> x

- name: A tag's '%' needs two hex digits after it
  spec:
    productions: [39, 36]
    quotes:
    - "[39] ns-uri-char ::= ( '%' ns-hex-digit{2} )"
    - "[36] ns-hex-digit"
  fail: true
  yaml: |
    - !<tag:a%2> x

- name: A verbatim tag's escape, expanded as a shorthand's is
  spec:
    productions: [39, 98]
    quotes:
    - "5.6: By convention, any URI characters other than the allowed printable ASCII characters are first encoded in UTF-8 and then each byte is escaped using the “%” character."
    - "5.6: The YAML processor must not expand such escaped characters."
    - "6.9.1: In this case, the YAML processor must deliver the verbatim tag as-is to the application."
    - "[39] ns-uri-char"
    - "[98] c-verbatim-tag"
  note: >-
    An open question, put to Kevin (2026-11-16). 5.6 says a processor must
    not expand a tag's escapes, and 6.9.1 that a verbatim tag is delivered
    as-is; Example 6.26 and the yaml-test-suite (6CK3) expand a
    shorthand's, which settles shorthands by the rule (6.9.1's case). No
    example or suite case reads a verbatim tag's, and yaml.zig expands it
    as it does a shorthand's, as libfyaml and the YAML reference parser
    do. A %TAG prefix's escape yaml.zig expands too, as the reference
    does; libfyaml keeps it.
  yaml: |
    !<tag:a%2Cb> x
  tree: |
    +STR
     +DOC
      =VAL <tag:a,b> :x
     -DOC
    -STR
