---
- name: A verbatim tag and an empty scalar make a key, its ':' at once after the tag
  spec:
    productions: [154, 159, 98]
    quotes:
    - "[154] ns-s-implicit-yaml-key(c) ::= ns-flow-yaml-node(0,c) s-separate-in-line?"
    - "[159] ( c-ns-properties(n,c) ( ( s-separate(n,c) ns-flow-yaml-content(n,c) ) | e-scalar ) )"
    - "[98] c-verbatim-tag ::= \"!<\" ns-uri-char+ '>'"
  note: >-
    A shorthand tag would take the `:` into its name (`!a: x` is tagged
    `!a:`). libfyaml refuses it (karte t82).
  yaml: |
    !<!v>: x
  tree: |
    +STR
     +DOC
      +MAP
       =VAL <!v> :
       =VAL :x
      -MAP
     -DOC
    -STR

- name: A flow collection's properties need a separation before it
  spec:
    productions: [160, 96]
    quotes:
    - "[160] c-flow-json-node(n,c) ::= ( c-ns-properties(n,c) s-separate(n,c) )? c-flow-json-content(n,c)"
  fail: true
  yaml: |
    [!{a: b}]

- name: A flow node's properties and an empty scalar, a closer at once after them
  spec:
    productions: [159]
    quotes:
    - "[159] ( c-ns-properties(n,c) ( ( s-separate(n,c) ns-flow-yaml-content(n,c) ) | e-scalar ) )"
  yaml: |
    [!a]
  tree: |
    +STR
     +DOC
      +SEQ []
       =VAL <!a> :
      -SEQ
     -DOC
    -STR

- name: A flow collection's properties, a space, and the collection
  spec:
    productions: [160]
    quotes:
    - "[160] c-flow-json-node(n,c) ::= ( c-ns-properties(n,c) s-separate(n,c) )? c-flow-json-content(n,c)"
  yaml: |
    [! {a: b}]
  tree: |
    +STR
     +DOC
      +SEQ []
       +MAP {} <!>
        =VAL :a
        =VAL :b
       -MAP
      -SEQ
     -DOC
    -STR

- name: Node properties, tag then anchor, anchor alone, and an alias (Example 6.23)
  spec:
    productions: [96]
    quotes:
    - "6.9: Node properties may be specified in any order before the node’s content. Either or both may be omitted."
  yaml: |
    !!str &a1 "foo":
      !!str bar
    &a2 baz : *a1
  tree: |
    +STR
     +DOC
      +MAP
       =VAL &a1 <tag:yaml.org,2002:str> "foo
       =VAL <tag:yaml.org,2002:str> :bar
       =VAL &a2 :baz
       =ALI *a1
      -MAP
     -DOC
    -STR

- name: An anchor before a tag
  spec:
    productions: [96]
    quotes:
    - "[96] ( c-ns-anchor-property ( s-separate(n,c) c-ns-tag-property )? )"
  yaml: |
    &a !!str x
  tree: |
    +STR
     +DOC
      =VAL &a <tag:yaml.org,2002:str> :x
     -DOC
    -STR

- name: A node's tag and anchor on lines of their own
  spec:
    productions: [96, 80]
    quotes:
    - "[96] ( c-ns-tag-property ( s-separate(n,c) c-ns-anchor-property )? )"
    - "[80] s-separate(n,BLOCK-IN) ::= s-separate-lines(n)"
  yaml: |
    !!str
    &a x
  tree: |
    +STR
     +DOC
      =VAL &a <tag:yaml.org,2002:str> :x
     -DOC
    -STR

- name: A tag on an empty node
  spec:
    productions: [96, 159]
    quotes:
    - "[159] ( c-ns-properties(n,c) ( ( s-separate(n,c) ns-flow-yaml-content(n,c) ) | e-scalar ) )"
    - "7.2: Both the node’s properties and node content are optional."
  yaml: |
    !!str
  tree: |
    +STR
     +DOC
      =VAL <tag:yaml.org,2002:str> :
     -DOC
    -STR

- name: An anchor on an empty node
  spec:
    productions: [96, 159]
    quotes:
    - "[159] ( c-ns-properties(n,c) ( ( s-separate(n,c) ns-flow-yaml-content(n,c) ) | e-scalar ) )"
  yaml: |
    &a
  tree: |
    +STR
     +DOC
      =VAL &a :
     -DOC
    -STR
