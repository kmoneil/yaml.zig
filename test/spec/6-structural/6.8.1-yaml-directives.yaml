---
- name: A reserved directive with parameters and comments (Example 6.13)
  spec:
    productions: [83, 84, 85]
    quotes:
    - "6.8: A YAML processor should ignore unknown directives with an appropriate warning."
    - "[83] ns-reserved-directive ::= ns-directive-name ( s-separate-in-line ns-directive-parameter )*"
  yaml: |
    %FOO  bar baz # Should be ignored
                   # with a warning.
    --- "foo"
  tree: |
    +STR
     +DOC ---
      =VAL "foo
     -DOC
    -STR

- name: A higher minor version is read (Example 6.14)
  spec:
    productions: [86, 87]
    quotes:
    - "6.8.1: Documents with a “YAML” directive specifying a higher minor version (e.g. “%YAML 1.3”) should be processed with an appropriate warning."
    - "[87] ns-yaml-version ::= ns-dec-digit+ '.' ns-dec-digit+"
  yaml: |
    %YAML 1.3 # Attempt parsing
               # with a warning
    ---
    "foo"
  tree: |
    +STR
     +DOC ---
      =VAL "foo
     -DOC
    -STR

- name: Version 1.1 is read
  spec:
    productions: [86]
    quotes:
    - "6.8.1: A version 1.2 YAML processor must also accept documents with an explicit “%YAML 1.1” directive."
  yaml: |
    %YAML 1.1
    ---
    foo
  tree: |
    +STR
     +DOC ---
      =VAL :foo
     -DOC
    -STR

- name: A higher major version is refused
  spec:
    productions: [86]
    quotes:
    - "6.8.1: Documents with a “YAML” directive specifying a higher major version (e.g. “%YAML 2.0”) should be rejected with an appropriate error message."
  note: >-
    A recommendation ("should"), which yaml.zig follows, as libfyaml does;
    the YAML reference parser reads it.
  fail: true
  yaml: |
    %YAML 2.0
    ---
    foo

- name: Two YAML directives for one document (Example 6.15)
  spec:
    productions: [86]
    quotes:
    - "6.8.1: It is an error to specify more than one “YAML” directive for the same document, even if both occurrences give the same version number."
  fail: true
  yaml: |
    %YAML 1.2
    %YAML 1.1
    foo
