---
- name: A TAG directive, its handle and prefix (Example 6.16)
  spec:
    productions: [88, 89]
    quotes:
    - "6.8.2: Each “TAG” directive associates a handle with a prefix."
    - "[88] ns-tag-directive ::= \"TAG\" s-separate-in-line c-tag-handle s-separate-in-line ns-tag-prefix"
    - "[89] c-tag-handle"
  yaml: |
    %TAG !yaml! tag:yaml.org,2002:
    ---
    !yaml!str "foo"
  tree: |
    +STR
     +DOC ---
      =VAL <tag:yaml.org,2002:str> "foo
     -DOC
    -STR

- name: Two TAG directives for one handle (Example 6.17)
  spec:
    productions: [88]
    quotes:
    - "6.8.2: It is an error to specify more than one “TAG” directive for the same handle in the same document, even if both occurrences give the same prefix."
    - "[88] ns-tag-directive"
  fail: true
  yaml: |
    %TAG ! !foo
    %TAG ! !foo
    bar

- name: The primary handle, by default and by a TAG directive (Example 6.18)
  spec:
    productions: [90]
    quotes:
    - "6.8.2.1: By default, the prefix associated with this handle is “!”."
    - "6.8.2.1: It is possible to override the default behavior by providing an explicit “TAG” directive, associating a different prefix for this handle."
    - "[90] c-primary-tag-handle"
  yaml: |
    # Private
    !foo "bar"
    ...
    # Global
    %TAG ! tag:example.com,2000:app/
    ---
    !foo "bar"
  tree: |
    +STR
     +DOC
      =VAL <!foo> "bar
     -DOC ...
     +DOC ---
      =VAL <tag:example.com,2000:app/foo> "bar
     -DOC
    -STR

- name: The secondary handle given another prefix (Example 6.19)
  spec:
    productions: [91]
    quotes:
    - "6.8.2.1: By default, the prefix associated with this handle is “tag:yaml.org,2002:”."
    - "[91] c-secondary-tag-handle ::= \"!!\""
  yaml: |
    %TAG !! tag:example.com,2000:app/
    ---
    !!int 1 - 3 # Interval, not integer
  tree: |
    +STR
     +DOC ---
      =VAL <tag:example.com,2000:app/int> :1 - 3
     -DOC
    -STR

- name: A named handle (Example 6.20)
  spec:
    productions: [92]
    quotes:
    - "6.8.2.1: A named tag handle surrounds a non-empty name with “!” characters."
    - "[92] c-named-tag-handle"
  yaml: |
    %TAG !e! tag:example.com,2000:app/
    ---
    !e!foo "bar"
  tree: |
    +STR
     +DOC ---
      =VAL <tag:example.com,2000:app/foo> "bar
     -DOC
    -STR

- name: A named handle with no TAG directive for it
  spec:
    productions: [92]
    quotes:
    - "6.8.2.1: A handle name must not be used in a tag shorthand unless an explicit “TAG” directive has associated some prefix with it."
    - "[92] c-named-tag-handle"
  fail: true
  yaml: |
    !h!bar baz

- name: A TAG directive holds for its own document alone
  spec:
    productions: [88, 209]
    quotes:
    - "6.8.2.1: A handle name must not be used in a tag shorthand unless an explicit “TAG” directive has associated some prefix with it."
    - "[209] l-directive-document ::= l-directive+ l-explicit-document"
    - "[88] ns-tag-directive"
  fail: true
  yaml: |
    %TAG !e! tag:a,
    --- !e!x a
    ...
    --- !e!x b

- name: A local tag prefix (Example 6.21)
  spec:
    productions: [93, 94]
    quotes:
    - "6.8.2.2: If the prefix begins with a “!” character, shorthands using the handle are expanded to a local tag."
    - "[94] c-ns-local-tag-prefix ::= c-tag # '!' ns-uri-char*"
    - "[93] ns-tag-prefix"
  yaml: |
    %TAG !m! !my-
    --- # Bulb here
    !m!light fluorescent
    ...
    %TAG !m! !my-
    --- # Color here
    !m!light green
  tree: |
    +STR
     +DOC ---
      =VAL <!my-light> :fluorescent
     -DOC ...
     +DOC ---
      =VAL <!my-light> :green
     -DOC
    -STR

- name: A global tag prefix (Example 6.22)
  spec:
    productions: [93, 95]
    quotes:
    - "6.8.2.2: If the prefix begins with a character other than “!”, it must be a valid URI prefix, and should contain at least the scheme."
    - "[95] ns-global-tag-prefix ::= ns-tag-char ns-uri-char*"
    - "[93] ns-tag-prefix"
  yaml: |
    %TAG !e! tag:example.com,2000:app/
    ---
    - !e!foo "bar"
  tree: |
    +STR
     +DOC ---
      +SEQ
       =VAL <tag:example.com,2000:app/foo> "bar
      -SEQ
     -DOC
    -STR
