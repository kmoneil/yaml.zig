---
- name: Verbatim tags, global and local (Example 6.24)
  spec:
    productions: [97, 98]
    quotes:
    - "6.9.1: In this case, the YAML processor must deliver the verbatim tag as-is to the application. In particular, verbatim tags are not subject to tag resolution."
    - "[97] c-ns-tag-property"
    - "[98] c-verbatim-tag"
  yaml: |
    !<tag:yaml.org,2002:str> foo :
      !<!bar> baz
  tree: |
    +STR
     +DOC
      +MAP
       =VAL <tag:yaml.org,2002:str> :foo
       =VAL <!bar> :baz
      -MAP
     -DOC
    -STR

- name: A verbatim '!' is no tag (Example 6.25)
  spec:
    productions: [98, 100]
    quotes:
    - "6.9.1: A verbatim tag must either begin with a “!” (a local tag) or be a valid URI (a global tag)."
    - "6.9.1: There is no way to explicitly specify the “?” non-specific tag."
    - "[98] c-verbatim-tag"
    - "[100] c-non-specific-tag"
  note: >-
    The spec's Example 6.25 gives it as an error: "Verbatim tags aren't
    resolved, so ! is invalid." The grammar lets it through; the YAML
    reference parser and libfyaml read it (karte t93).
  fail: true
  yaml: |
    - !<!> foo

- name: A verbatim tag neither local nor a URI (Example 6.25)
  spec:
    productions: [98]
    quotes:
    - "6.9.1: A verbatim tag must either begin with a “!” (a local tag) or be a valid URI (a global tag)."
    - "[98] c-verbatim-tag"
  note: >-
    The spec's Example 6.25 gives it as an error: "The $:? tag is neither a
    global URI tag nor a local tag starting with '!'." A URI's scheme
    begins with a letter. The YAML reference parser and libfyaml read it
    (karte t93).
  fail: true
  yaml: |
    - !<$:?> bar

- name: Tag shorthands, a suffix's '!' written as an escape (Example 6.26)
  spec:
    productions: [99]
    quotes:
    - "6.9.1: If the suffix needs to specify any of the above restricted characters, they must be escaped using the “%” character."
    - "[99] c-ns-shorthand-tag ::= c-tag-handle ns-tag-char+"
  yaml: |
    %TAG !e! tag:example.com,2000:app/
    ---
    - !local foo
    - !!str bar
    - !e!tag%21 baz
  tree: |
    +STR
     +DOC ---
      +SEQ
       =VAL <!local> :foo
       =VAL <tag:yaml.org,2002:str> :bar
       =VAL <tag:example.com,2000:app/tag!> :baz
      -SEQ
     -DOC
    -STR

- name: A tag shorthand with no suffix (Example 6.27)
  spec:
    productions: [99]
    quotes:
    - "6.9.1: A tag shorthand consists of a valid tag handle followed by a non-empty suffix."
    - "[99] c-ns-shorthand-tag"
  note: libfyaml reads it, its tag the prefix alone.
  fail: true
  yaml: |
    %TAG !e! tag:example,2000:app/
    ---
    - !e! foo

- name: A tag shorthand whose handle has no TAG directive (Example 6.27)
  spec:
    productions: [99, 92]
    quotes:
    - "6.9.1: The tag handle must be associated with a prefix, either by default or by using a “TAG” directive."
    - "[99] c-ns-shorthand-tag"
    - "[92] c-named-tag-handle"
  fail: true
  yaml: |
    %TAG !e! tag:example,2000:app/
    ---
    - !h!bar baz

- name: A suffix holding a '!' would make a named handle
  spec:
    productions: [99, 40]
    quotes:
    - "6.9.1: The suffix must not contain any “!” character. This would cause the tag shorthand to be interpreted as having a named tag handle."
    - "[99] c-ns-shorthand-tag"
    - "[40] ns-tag-char"
  note: Read so, `!a!` has no TAG directive.
  fail: true
  yaml: |
    !a!b x

- name: A suffix ends before a flow indicator
  spec:
    productions: [99, 40]
    quotes:
    - "6.9.1: In addition, the suffix must not contain the “[”, “]”, “{”, “}” and “,” characters."
    - "[40] ns-tag-char ::= ns-uri-char - c-tag # '!' - c-flow-indicator"
    - "[99] c-ns-shorthand-tag"
  note: libfyaml reads one tag, `!a,b`.
  yaml: |
    [!a,b]
  tree: |
    +STR
     +DOC
      +SEQ []
       =VAL <!a> :
       =VAL :b
      -SEQ
     -DOC
    -STR

- name: A shorthand expanding to neither a local tag nor a URI
  spec:
    productions: [99, 95]
    quotes:
    - "6.9.1: The resulting parsed tag is the concatenation of the prefix and the suffix and must either begin with “!” (a local tag) or be a valid URI (a global tag)."
    - "[99] c-ns-shorthand-tag"
    - "[95] ns-global-tag-prefix"
  note: >-
    `foo` and `x` make `foox`, with no scheme. The YAML reference parser
    and libfyaml read it (karte t93).
  fail: true
  yaml: |
    %TAG !e! foo
    --- !e!x a

- name: A shorthand expanding to a URI
  spec:
    productions: [99, 95]
    quotes:
    - "6.9.1: The resulting parsed tag is the concatenation of the prefix and the suffix and must either begin with “!” (a local tag) or be a valid URI (a global tag)."
    - "[99] c-ns-shorthand-tag"
    - "[95] ns-global-tag-prefix"
  yaml: |
    %TAG !e! foo:
    --- !e!x a
  tree: |
    +STR
     +DOC ---
      =VAL <foo:x> :a
     -DOC
    -STR

- name: The non-specific tag (Example 6.28)
  spec:
    productions: [100]
    quotes:
    - "6.9.1: It is possible for the tag property to be explicitly set to the “!” non-specific tag."
    - "[100] c-non-specific-tag ::= '!'"
  yaml: |
    # Assuming conventional resolution:
    - "12"
    - 12
    - ! 12
  tree: |
    +STR
     +DOC
      +SEQ
       =VAL "12
       =VAL :12
       =VAL <!> :12
      -SEQ
     -DOC
    -STR
